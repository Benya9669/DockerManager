# Docker Manager. Settings are read from .env next to this file (see .env.example).
services:
  dockermanager:
    # DM_UPDATE_MODE=git   -> image is built locally from this repo (git pull + build)
    # DM_UPDATE_MODE=image -> image is pulled from GHCR (published by GitHub Actions)
    build: .
    image: ghcr.io/benya9669/dockermanager:${DM_IMAGE_TAG:-latest}
    container_name: dockermanager
    restart: unless-stopped
    ports:
      - "${DM_PORT:-8000}:8000"
    environment:
      DM_DATA_DIR: /data
      # Must be the SAME path inside and outside the container,
      # otherwise relative bind mounts (./data:/data) in managed projects break.
      DM_PROJECTS_DIR: ${DM_PROJECTS_DIR:-/opt/dockermanager/projects}
      DM_ADMIN_USERNAME: ${DM_ADMIN_USERNAME:-admin}
      DM_ADMIN_PASSWORD: ${DM_ADMIN_PASSWORD:-}
      DM_SECRET_KEY: ${DM_SECRET_KEY:-}
      DM_ALERT_WEBHOOK: ${DM_ALERT_WEBHOOK:-}
      DM_TELEGRAM_TOKEN: ${DM_TELEGRAM_TOKEN:-}
      DM_TELEGRAM_CHAT_ID: ${DM_TELEGRAM_CHAT_ID:-}
      DM_PUBLIC_URL: ${DM_PUBLIC_URL:-}
      DM_DATABASE_URL: ${DM_DATABASE_URL:-}
      DM_ALLOW_LOCAL_PATHS: ${DM_ALLOW_LOCAL_PATHS:-true}
      DM_AUTO_PRUNE_INTERVAL_HOURS: ${DM_AUTO_PRUNE_INTERVAL_HOURS:-0}
      DM_AUTO_PRUNE_OLDER_THAN_HOURS: ${DM_AUTO_PRUNE_OLDER_THAN_HOURS:-72}
      DM_UPDATE_MODE: ${DM_UPDATE_MODE:-git}
      DM_UPDATE_REPO: ${DM_UPDATE_REPO:-Benya9669/DockerManager}
      DM_UPDATE_GITHUB_TOKEN: ${DM_UPDATE_GITHUB_TOKEN:-}
      DM_UPDATE_SSH_KEY: ${DM_UPDATE_SSH_KEY:-}
      DM_AUTO_UPDATE: ${DM_AUTO_UPDATE:-false}
      DM_UPDATE_CHECK_HOURS: ${DM_UPDATE_CHECK_HOURS:-6}
      # /root/.ssh belongs to the panel container -> it may write per-server SSH aliases
      DM_MANAGE_SSH_CONFIG: "true"
      DM_METRICS_INTERVAL: ${DM_METRICS_INTERVAL:-30}
      DM_METRICS_RETENTION_HOURS: ${DM_METRICS_RETENTION_HOURS:-24}
      DM_BACKUP_INTERVAL_HOURS: ${DM_BACKUP_INTERVAL_HOURS:-0}
      DM_BACKUP_KEEP: ${DM_BACKUP_KEEP:-7}
      DM_BACKUP_STOP_CONTAINERS: ${DM_BACKUP_STOP_CONTAINERS:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dm-data:/data
      - ${DM_PROJECTS_DIR:-/opt/dockermanager/projects}:${DM_PROJECTS_DIR:-/opt/dockermanager/projects}
      # Existing compose stacks to import: mount their folders at the same path
      # in docker-compose.override.yml (see docker-compose.override.example.yml)
      # SSH keys (+ optional config/known_hosts) for git@ repositories.
      # Copied into /root/.ssh with correct permissions at startup.
      - ${DM_SSH_DIR:-./ssh}:/ssh-src:ro

volumes:
  dm-data:
